<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Library System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            color: #e0e0e0;
            margin: 0;
            overflow-x: hidden;
        }
        h1 {
            color: #39ff14;
            text-shadow: 0 0 10px #39ff14, 0 0 20px #39ff14;
        }
        h2 {
            color: #00ffff;
            text-shadow: 0 0 10px #00ffff, 0 0 20px #00ffff;
        }
        .background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            z-index: -2;
            animation: gradientShift 20s ease infinite;
        }
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><circle cx="50" cy="50" r="2" fill="rgba(255,255,255,0.1)"/></svg>') repeat;
            animation: float 20s linear infinite;
            z-index: -1;
        }
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.3);
            z-index: -1;
        }
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        @keyframes float {
            0% { background-position: 0 0; }
            100% { background-position: 100px 100px; }
        }
        .glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .table-row:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateX(5px);
            transition: all 0.3s ease;
        }
        .btn {
            transition: all 0.3s ease;
            border: 1px solid rgba(57, 255, 20, 0.2);
        }
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(57, 255, 20, 0.3);
        }
        input, select {
            transition: all 0.3s ease;
        }
        input:focus, select:focus {
            box-shadow: 0 0 10px rgba(57, 255, 20, 0.5);
        }
        select {
            background-color: #2c2f4a;
            color: #ffffff;
        }
        option {
            background-color: #2c2f4a;
            color: white;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center p-6 relative">
    <div class="background"></div>
    <div class="particles"></div>
    <div class="overlay"></div>

    <h1 class="text-5xl font-extrabold mb-10 text-center z-10">Online Library System</h1>

    <div class="w-full max-w-lg glass p-8 rounded-xl shadow-2xl mb-10 z-10">
        <h2 class="text-2xl font-semibold mb-6">Add New Book</h2>
        <form id="bookForm" class="space-y-5">
            <input type="hidden" id="bookId">
            <div>
                <label for="title" class="block text-sm font-medium text-gray-300">Title</label>
                <input type="text" id="title" class="w-full p-3 bg-transparent border border-gray-500 rounded-lg focus:outline-none text-white" required>
            </div>
            <div>
                <label for="author" class="block text-sm font-medium text-gray-300">Author</label>
                <input type="text" id="author" class="w-full p-3 bg-transparent border border-gray-500 rounded-lg focus:outline-none text-white" required>
            </div>
            <div>
                <label for="year" class="block text-sm font-medium text-gray-300">Publication Year</label>
                <input type="number" id="year" class="w-full p-3 bg-transparent border border-gray-500 rounded-lg focus:outline-none text-white" required>
            </div>
            <div>
                <label for="genre" class="block text-sm font-medium text-gray-300">Genre/Category</label>
                <select id="genre" class="w-full p-3 border border-gray-500 rounded-lg focus:outline-none" required>
                    <option value="" disabled selected>Select Genre</option>
                    <option value="Fiction">Fiction</option>
                    <option value="Non-Fiction">Non-Fiction</option>
                    <option value="Sci-Fi">Sci-Fi</option>
                    <option value="Fantasy">Fantasy</option>
                    <option value="Mystery">Mystery</option>
                    <option value="Biography">Biography</option>
                </select>
            </div>
            <div class="flex items-center">
                <input type="checkbox" id="available" class="mr-2 h-5 w-5 text-green-500 focus:ring-green-500">
                <label for="available" class="text-sm font-medium text-gray-300">Available</label>
            </div>
            <button type="submit" id="submitBtn" class="w-full bg-green-500 text-white p-3 rounded-lg hover:bg-green-600 btn">Add Book</button>
            <button type="button" id="cancelBtn" class="w-full bg-red-500 text-white p-3 rounded-lg hover:bg-red-600 btn hidden">Cancel Update</button>
        </form>
    </div>

    <div class="w-full max-w-5xl glass p-8 rounded-xl shadow-2xl z-10">
        <h2 class="text-2xl font-semibold mb-6">Books List</h2>
        <table class="w-full rounded-lg">
            <thead>
                <tr class="bg-gray-900 text-gray-200">
                    <th class="p-4 text-left">Title</th>
                    <th class="p-4 text-left">Author</th>
                    <th class="p-4 text-left">Year</th>
                    <th class="p-4 text-left">Genre</th>
                    <th class="p-4 text-left">Status</th>
                    <th class="p-4 text-center">Actions</th>
                </tr>
            </thead>
            <tbody id="booksTable" class="text-gray-300"></tbody>
        </table>
    </div>

    <script>
        let books = [];
        let editId = null;

        const bookForm = document.getElementById('bookForm');
        const booksTable = document.getElementById('booksTable');
        const submitBtn = document.getElementById('submitBtn');
        const cancelBtn = document.getElementById('cancelBtn');

        if (localStorage.getItem('books')) {
            books = JSON.parse(localStorage.getItem('books'));
            renderBooks();
        }

        bookForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const title = document.getElementById('title').value.trim();
            const author = document.getElementById('author').value.trim();
            const year = document.getElementById('year').value;
            const genre = document.getElementById('genre').value;
            const available = document.getElementById('available').checked;

            if (!editId) {
                const duplicate = books.some(book =>
                    book.title.toLowerCase() === title.toLowerCase() &&
                    book.author.toLowerCase() === author.toLowerCase()
                );
                if (duplicate) {
                    alert('This book already exists!');
                    return;
                }

                const book = {
                    id: Date.now().toString(),
                    title,
                    author,
                    year: parseInt(year),
                    genre,
                    available
                };
                books.push(book);
            } else {
                books = books.map(book =>
                    book.id === editId ? { ...book, title, author, year: parseInt(year), genre, available } : book
                );
                editId = null;
                submitBtn.textContent = 'Add Book';
                cancelBtn.classList.add('hidden');
            }

            localStorage.setItem('books', JSON.stringify(books));
            renderBooks();
            bookForm.reset();
            document.getElementById('genre').value = '';
        });

        cancelBtn.addEventListener('click', () => {
            editId = null;
            submitBtn.textContent = 'Add Book';
            cancelBtn.classList.add('hidden');
            bookForm.reset();
            document.getElementById('genre').value = '';
        });

        function renderBooks() {
            booksTable.innerHTML = '';
            books.forEach(book => {
                const row = document.createElement('tr');
                row.className = 'table-row';
                row.innerHTML = `
                    <td class="p-4">${book.title}</td>
                    <td class="p-4">${book.author}</td>
                    <td class="p-4">${book.year}</td>
                    <td class="p-4">${book.genre}</td>
                    <td class="p-4">${book.available ? 'Available' : 'Unavailable'}</td>
                    <td class="p-4 text-center space-x-3">
                        <button onclick="editBook('${book.id}')" class="bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600 btn">Edit</button>
                        <button onclick="deleteBook('${book.id}')" class="bg-red-500 text-white px-4 py-2 rounded-lg hover:bg-red-600 btn">Delete</button>
                    </td>
                `;
                booksTable.appendChild(row);
            });
        }

        window.editBook = function(id) {
            const book = books.find(b => b.id === id);
            if (book) {
                document.getElementById('title').value = book.title;
                document.getElementById('author').value = book.author;
                document.getElementById('year').value = book.year;
                document.getElementById('genre').value = book.genre;
                document.getElementById('available').checked = book.available;
                editId = id;
                submitBtn.textContent = 'Update Book';
                cancelBtn.classList.remove('hidden');
            }
        };

        window.deleteBook = function(id) {
            if (confirm('Are you sure you want to delete this book?')) {
                books = books.filter(book => book.id !== id);
                localStorage.setItem('books', JSON.stringify(books));
                renderBooks();
            }
        };
    </script>
</body>
</html>
